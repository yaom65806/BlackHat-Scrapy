name: Run Scrapy

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # Python
      # =========================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================================================
      # Install Python dependencies
      # =========================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================================================
      # Install Linux packages
      #
      # wget: 下载 PDF
      # Chromium libraries: 给 pyppeteer / Chrome 使用
      # =========================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            ca-certificates \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            xdg-utils

      # =========================================================
      # Check Chrome
      #
      # ubuntu-latest 通常已经包含 Google Chrome
      # 你的 scrapy.py 会优先寻找 /usr/bin/google-chrome
      # =========================================================
      - name: Check Chrome
        run: |
          echo "===== Chrome ====="

          which google-chrome || true
          which google-chrome-stable || true
          which chromium || true
          which chromium-browser || true

          google-chrome --version || true
          google-chrome-stable --version || true
          chromium --version || true

      # =========================================================
      # Display target.txt
      # =========================================================
      - name: Show targets
        run: |
          echo "===== target.txt ====="

          if [ ! -f target.txt ]; then
            echo "ERROR: target.txt does not exist"
            exit 1
          fi

          cat target.txt

      # =========================================================
      # Prepare folders
      #
      # Python 本身也会创建 save，
      # 这里提前创建是为了即使脚本失败，
      # 后续 artifact 仍然可以打包 debug 信息。
      # =========================================================
      - name: Prepare output folders
        run: |
          mkdir -p save
          mkdir -p debug

      # =========================================================
      # Test BlackHat access
      #
      # 只是打印状态，不影响后续执行。
      # 如果这里 403，日志会很清楚。
      # =========================================================
      - name: Test BlackHat access
        continue-on-error: true
        run: |
          echo "===== blackhat.com ====="

          curl \
            -L \
            -I \
            --max-time 20 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
            https://blackhat.com/ || true

          echo ""
          echo "===== US-26 schedule ====="

          curl \
            -L \
            -I \
            --max-time 20 \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
            https://blackhat.com/us-26/briefings/schedule/index.html || true

      # =========================================================
      # Run scraper
      # =========================================================
      - name: Run scraper
        run: |
          python scrapy.py

      # =========================================================
      # Show results
      #
      # 即使 scrapy.py 失败也执行，方便排查。
      # =========================================================
      - name: Show downloaded files
        if: always()
        run: |
          echo "===== SAVE ====="

          find save -type f -printf "%p %k KB\n" 2>/dev/null || true

          echo ""
          echo "===== DEBUG ====="

          find debug -type f -printf "%p %k KB\n" 2>/dev/null || true

          echo ""
          echo "===== DIRECTORY SIZE ====="

          du -sh save 2>/dev/null || true
          du -sh debug 2>/dev/null || true

      # =========================================================
      # Package result
      #
      # 即使 scraper 失败，也打包当前已有内容。
      # =========================================================
      - name: Tar files
        if: always()
        run: |
          tar \
            -zcvf BlackHat-PDF.tar.gz \
            save \
            debug

          ls -lh BlackHat-PDF.tar.gz

      # =========================================================
      # Upload artifact
      # =========================================================
      - name: Deliver PDF files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BlackHat-PDF
          path: BlackHat-PDF.tar.gz
          if-no-files-found: warn
          retention-days: 30
